# Google Cloud Scheduler — Unpaid book follow-up LINE reminders
#
# Every day at 10:00 ICT the learning service looks for books a tutor opened
# that an ACTIVE student has not paid for yet (EnrollmentPackage
# PENDING_PAYMENT) and sends one LINE follow-up on day 1, 3 and 7 after the
# book was opened, with a link to the payment page. Nothing is sent after
# day 14. Each follow-up is claimed in learning.notification_deliveries first,
# so retries are safe (see docs/runbooks/scheduled-reminders.md).
#
# The route answers 503 when any delivery failed. The retries below then run
# within about 30 minutes, while LINE still remembers each push's
# X-Line-Retry-Key (24 hours); tomorrow's run would be too late for the key to
# stop a duplicate. Five retries (1, 3, 7, 15, 31 min) also outlast the
# 10-minute stale-claim threshold if a run died mid-send.
#
# Deploy:
#   gcloud scheduler jobs create http ta-book-payment-reminders \
#     --schedule="0 10 * * *" \
#     --time-zone="Asia/Bangkok" \
#     --uri="https://<LEARNING_SERVICE_URL>/v1/internal/reminders/book-payments" \
#     --http-method=POST \
#     --headers="X-Internal-Key=<INTERNAL_API_KEY>,Content-Type=application/json" \
#     --message-body="{}" \
#     --attempt-deadline=300s \
#     --max-retry-attempts=5 \
#     --min-backoff=60s \
#     --max-backoff=3600s \
#     --location=asia-southeast1 \
#     --project=<GCP_PROJECT_ID>

name: ta-book-payment-reminders
description: "Daily LINE follow-up for opened books that are still unpaid"
schedule: "0 10 * * *"
timeZone: "Asia/Bangkok"

httpTarget:
  uri: "https://<LEARNING_SERVICE_URL>/v1/internal/reminders/book-payments"
  httpMethod: POST
  headers:
    Content-Type: "application/json"
    X-Internal-Key: "<INTERNAL_API_KEY>"  # from Secret Manager in production
  body: "{}"

attemptDeadline: "300s"

retryConfig:
  retryCount: 5
  minBackoffDuration: "60s"
  maxBackoffDuration: "3600s"
  maxDoublings: 5
