openapi: 3.1.0
info:
  title: Tutor Advantage Learning Service API
  version: "1.0.0"
  description: API for managing classes, referrals, and enrollment.
servers:
  - url: http://localhost:3002
    description: Local development server
paths:
  /v1/book-cycles/{cycleId}/voice-entitlement:
    get:
      summary: Get the student's metered AI voice entitlement for a purchased book
      security: [{ bearerAuth: [] }]
      parameters: [{ name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Voice entitlement and unlocked completed articles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceEntitlement" }
        "403": { $ref: "#/components/responses/VoiceError" }
  /v1/book-cycles/{cycleId}/voice-sessions:
    get:
      summary: List the student's completed AI voice sessions without raw transcripts or audio
      security: [{ bearerAuth: [] }]
      parameters: [{ name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Voice session history
          content: { application/json: { schema: { type: object, required: [sessions], properties: { sessions: { type: array, items: { $ref: "#/components/schemas/VoiceSessionSummary" } } } } } }
    post:
      summary: Reserve book quota and create an OpenAI Realtime WebRTC call
      security: [{ bearerAuth: [] }]
      parameters: [{ name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [articleId, sdp]
              properties:
                articleId: { type: string, minLength: 1, maxLength: 200 }
                sdp: { type: string, minLength: 3, maxLength: 100000 }
      responses:
        "201":
          description: WebRTC answer and the pending connection lease deadline
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, answerSdp, expiresAt, reservedSeconds, remainingSeconds]
                properties:
                  sessionId: { type: string, format: uuid }
                  answerSdp: { type: string }
                  expiresAt: { type: string, format: date-time }
                  reservedSeconds: { type: integer, minimum: 1, maximum: 600 }
                  remainingSeconds: { type: integer, minimum: 0 }
        "409": { $ref: "#/components/responses/VoiceError" }
        "503": { $ref: "#/components/responses/VoiceError" }
  /v1/voice-sessions/{sessionId}/connected:
    post:
      summary: Start authoritative wall-clock billing after the WebRTC peer connection succeeds
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Idempotent connected acknowledgement and final quota deadline
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, expiresAt]
                properties:
                  sessionId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/VoiceError" }
        "404": { $ref: "#/components/responses/VoiceError" }
  /v1/voice-sessions/{sessionId}/end:
    post:
      summary: End an AI voice session idempotently and persist derived feedback only
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transcript: { type: string, maxLength: 20000, description: Transient fallback input; never persisted }
      responses:
        "200":
          description: Final metered usage and derived feedback
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "404": { $ref: "#/components/responses/VoiceError" }
  /v1/classes/{classId}/voice-practice-summary:
    get:
      summary: Get derived voice-practice feedback for the owning tutor
      security: [{ bearerAuth: [] }]
      parameters: [{ name: classId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Class voice summaries without transcripts or audio
          content: { application/json: { schema: { type: object, required: [sessions], properties: { sessions: { type: array, items: { $ref: "#/components/schemas/VoiceSessionSummary" } } } } } }
        "403": { $ref: "#/components/responses/VoiceError" }
  /v1/book-cycles/{cycleId}/assessment:
    get:
      summary: Get own article assessment results and availability
      security:
        - bearerAuth: []
      parameters:
        - &a1
          name: cycleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses: &a2
        "200":
          description: Assessment result (no answer key or listening transcript)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "403":
          description: Enrollment/package access or class ownership required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "404":
          description: Cycle or supported assessment not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "409":
          description: Assessment phase closed, not started, or form version changed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
  /v1/book-cycles/{cycleId}/assessment/start:
    post:
      summary: Retired self-service start; use teacher-controlled Lobby
      deprecated: true
      description: Authorized supported requests return 409 TEACHER_CONTROLLED. Start through assessment_control on the authenticated lesson socket.
      security:
        - bearerAuth: []
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
              properties:
                stage: &a3
                  type: string
                  enum:
                    - PRE
                    - POST
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/submit:
    post:
      summary: Retired self-service submission; teacher finishes the assessment
      deprecated: true
      description: Authorized supported requests return 409 TEACHER_CONTROLLED. Students save individual answers through assessment_answer; only teacher finish grades complete drafts.
      security:
        - bearerAuth: []
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
                - answers
              properties:
                stage: *a3
                answers:
                  type: object
                  minProperties: 15
                  maxProperties: 15
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 3
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/report:
    get:
      summary: Class owner report including students without results
      security:
        - bearerAuth: []
      parameters:
        - *a1
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/open-post:
    post:
      summary: Retired HTTP post opening; use teacher-controlled Lobby
      deprecated: true
      description: Authorized supported requests return 409 TEACHER_CONTROLLED. Selecting POST then starting through assessment_control permanently closes pre-assessment.
      security:
        - bearerAuth: []
      parameters:
        - *a1
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/attempts/{attemptId}/comment:
    patch:
      summary: Class owner saves student-visible feedback
      security:
        - bearerAuth: []
      parameters:
        - *a1
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - comment
              properties:
                comment:
                  type: string
                  maxLength: 2000
      responses: *a2
  /health:
    get:
      summary: Health Check
      responses:
        "200":
          description: OK
  /version:
    get:
      summary: Get Service Version
      responses:
        "200":
          description: Version metadata
  /v1/classes:
    post:
      summary: Create Class
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [bookId, title, capacity]
              properties:
                bookId:
                  type: string
                title:
                  type: string
                  minLength: 1
                capacity:
                  type: integer
                  minimum: 1
                packagePriceSatang:
                  $ref: "#/components/schemas/NonNegativeSatang"
      responses:
        "201":
          description: Class created
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /v1/classes/{classId}/close:
    post:
      summary: Close Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Class closed
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /v1/referrals/generate:
    post:
      summary: Generate Referral Link/QR Payload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classId]
              properties:
                classId:
                  type: string
      responses:
        "200":
          description: Referral token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  qrPayload:
                    type: string
  /v1/enroll/{referralToken}:
    post:
      summary: Enroll via Referral Token
      security:
        - bearerAuth: []
      parameters:
        - name: referralToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrollment successful (Primary or Fallback)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, enrollmentId, classId, placement]
                properties:
                  message:
                    type: string
                  enrollmentId:
                    type: string
                  classId:
                    type: string
                  placement:
                    type: string
                    enum: [PRIMARY, FALLBACK]
        "400":
          description: Invalid token or full class without fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VoiceEntitlement:
      type: object
      required: [enabled, totalSeconds, unlockedSeconds, usedSeconds, remainingSeconds, completedArticles, eligibleArticles]
      properties:
        enabled: { type: boolean }
        totalSeconds: { type: integer, minimum: 0 }
        unlockedSeconds: { type: integer, minimum: 0 }
        usedSeconds: { type: integer, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
        completedArticles: { type: integer, minimum: 0 }
        eligibleArticles:
          type: array
          items:
            type: object
            required: [articleId, title]
            properties:
              articleId: { type: string }
              title: { type: string }
        activeSession:
          oneOf:
            - type: "null"
            - type: object
              required: [sessionId, expiresAt]
              properties:
                sessionId: { type: string, format: uuid }
                expiresAt: { type: string, format: date-time }
    VoiceSessionSummary:
      type: object
      additionalProperties: true
      required: [voiceSessionId, articleId, consumedSeconds]
      properties:
        voiceSessionId: { type: string, format: uuid }
        articleId: { type: string }
        consumedSeconds: { type: integer, minimum: 0 }
        summary: { type: [object, "null"], additionalProperties: true }
        scores: { type: [object, "null"], additionalProperties: true }
    VoiceErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    NonNegativeSatang:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Integer amount in Satang within JavaScript's safe integer range.
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
  responses:
    VoiceError:
      description: Voice practice authorization, quota, concurrency, or provider error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceErrorEnvelope" }
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
