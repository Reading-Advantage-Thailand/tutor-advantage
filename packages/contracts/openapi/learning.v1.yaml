openapi: 3.1.0
info:
  title: Tutor Advantage Learning Service API
  version: "1.0.0"
  description: API for managing classes, referrals, and enrollment.
servers:
  - url: http://localhost:3002
    description: Local development server
paths:
  /v1/book-cycles/{cycleId}/assessment:
    get:
      summary: Get own Origins 2 pilot results and phase availability
      security:
        - bearerAuth: []
      parameters:
        - &a1
          name: cycleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses: &a2
        "200":
          description: Assessment result (no answer key or listening transcript)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "403":
          description: Enrollment/package access or class ownership required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "404":
          description: Cycle or supported assessment not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "409":
          description: Assessment phase closed, not started, or form version changed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
  /v1/book-cycles/{cycleId}/assessment/start:
    post:
      summary: Retired self-service start; use teacher-controlled Lobby
      deprecated: true
      description: Authorized supported requests return 409 TEACHER_CONTROLLED. Start through assessment_control on the authenticated lesson socket.
      security:
        - bearerAuth: []
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
              properties:
                stage: &a3
                  type: string
                  enum:
                    - PRE
                    - POST
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/submit:
    post:
      summary: Retired self-service submission; teacher finishes the assessment
      deprecated: true
      description: Authorized supported requests return 409 TEACHER_CONTROLLED. Students save individual answers through assessment_answer; only teacher finish grades complete drafts.
      security:
        - bearerAuth: []
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - stage
                - answers
              properties:
                stage: *a3
                answers:
                  type: object
                  minProperties: 15
                  maxProperties: 15
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 3
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/report:
    get:
      summary: Class owner report including students without results
      security:
        - bearerAuth: []
      parameters:
        - *a1
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/open-post:
    post:
      summary: Retired HTTP post opening; use teacher-controlled Lobby
      deprecated: true
      description: Authorized supported requests return 409 TEACHER_CONTROLLED. Selecting POST then starting through assessment_control permanently closes pre-assessment.
      security:
        - bearerAuth: []
      parameters:
        - *a1
      responses: *a2
  /v1/book-cycles/{cycleId}/assessment/attempts/{attemptId}/comment:
    patch:
      summary: Class owner saves student-visible feedback
      security:
        - bearerAuth: []
      parameters:
        - *a1
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - comment
              properties:
                comment:
                  type: string
                  maxLength: 2000
      responses: *a2
  /health:
    get:
      summary: Health Check
      responses:
        "200":
          description: OK
  /version:
    get:
      summary: Get Service Version
      responses:
        "200":
          description: Version metadata
  /v1/classes:
    post:
      summary: Create Class
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [bookId, title, capacity]
              properties:
                bookId:
                  type: string
                title:
                  type: string
                  minLength: 1
                capacity:
                  type: integer
                  minimum: 1
                packagePriceSatang:
                  $ref: "#/components/schemas/NonNegativeSatang"
      responses:
        "201":
          description: Class created
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /v1/classes/{classId}/close:
    post:
      summary: Close Class
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Class closed
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /v1/referrals/generate:
    post:
      summary: Generate Referral Link/QR Payload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classId]
              properties:
                classId:
                  type: string
      responses:
        "200":
          description: Referral token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  qrPayload:
                    type: string
  /v1/enroll/{referralToken}:
    post:
      summary: Enroll via Referral Token
      security:
        - bearerAuth: []
      parameters:
        - name: referralToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrollment successful (Primary or Fallback)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, enrollmentId, classId, placement]
                properties:
                  message:
                    type: string
                  enrollmentId:
                    type: string
                  classId:
                    type: string
                  placement:
                    type: string
                    enum: [PRIMARY, FALLBACK]
        "400":
          description: Invalid token or full class without fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NonNegativeSatang:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Integer amount in Satang within JavaScript's safe integer range.
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
  responses:
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
