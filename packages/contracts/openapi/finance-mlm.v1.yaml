openapi: 3.1.0
info:
  title: Tutor Advantage Finance & MLM Service API
  version: "1.0.0"
  description: API for payments, MLM settlement, and admin console tasks. Note that all currency amounts are in Satang (Integer).
servers:
  - url: http://localhost:3003
    description: Local development server
paths:
  /health:
    get:
      summary: Health Check
      responses:
        "200":
          description: OK
  /version:
    get:
      summary: Get Service Version
      responses:
        "200":
          description: Version metadata
  /v1/payments/intent:
    post:
      summary: Create Payment Intent
      description: Create a payment intent for THB checkout.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollmentId, amountSatang]
              properties:
                enrollmentId:
                  type: string
                amountSatang:
                  $ref: "#/components/schemas/PositiveSatang"
                enrollmentPackageId:
                  type: string
                idempotencyKey:
                  type: string
                method:
                  type: string
                  enum: [promptpay, card]
                omiseToken:
                  type: string
                  description: Required for card payments. Token generated client-side by Omise.js.
                returnUri:
                  type: string
                  description: URI Omise should return the customer to after 3DS or redirect flows.
      responses:
        "201":
          description: Payment intent and Omise checkout details.
  /v1/payments/config:
    get:
      summary: Get Payment Gateway Config
      description: Returns public, non-secret payment gateway configuration for the frontend.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Omise public key and configuration status.
  /v1/payments/{paymentIntentId}/status:
    get:
      summary: Get Payment Status
      description: Retrieves a payment intent and reconciles current Omise charge status when available.
      security:
        - bearerAuth: []
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment intent and Omise checkout status.
  /v1/payments/webhook:
    post:
      summary: Payment Gateway Webhook
      description: Receives Omise charge completion events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              minProperties: 1
              anyOf:
                - required: [id]
                - required: [event_id]
                - required: [data]
      responses:
        "200":
          description: Webhook ingested successfully
  /v1/reconciliation/payments:
    get:
      summary: Payment Reconciliation Dashboard Data
      description: Returns payment, enrollment, and webhook reconciliation queues for finance/admin review.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 180
        # ── G3 (payments operations) additions: server paging + filters ──
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, PENDING, PROCESSING, SUCCESS, FAILED, EXPIRED, CANCELLED, REFUNDED, CHARGEBACKED]
        - name: issue
          in: query
          required: false
          description: ALL, ISSUES (any non-OK), OK, or one issue type.
          schema:
            type: string
            enum: [ALL, ISSUES, OK, ENROLLMENT_TARGET_NOT_FOUND, SUCCESS_NOT_ACTIVE, FAILED_ACTIVE, STALE_PENDING, MISSING_PAYMENT_REF]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, amount]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        # ── end G3 additions ──
      responses:
        "200":
          description: Reconciliation summary and queues.
  /v1/settlements/preview:
    post:
      summary: Preview Monthly Settlement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [periodMonth]
              properties:
                periodMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Settlement preview details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, preview]
                properties:
                  message:
                    type: string
                  preview:
                    $ref: "#/components/schemas/SettlementPreview"
  /v1/settlements/{snapshotId}/approve:
    post:
      summary: Approve Settlement Run
      security:
        - bearerAuth: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run approved by checker
        "403":
          $ref: "#/components/responses/ForbiddenError"
  # ── Audit trail (owner: admin G1) ─────────────────────────────────────
  /v1/audit-logs:
    get:
      summary: Admin audit trail (paged)
      description: >
        All audit events (settlements, adjustments, users, roles, fraud, exceptions, coupons),
        newest first. Filters combine with AND. `periodMonth`, `from` and `to` filter on the
        event time (created_at) in Asia/Bangkok, so events without a settlement period are
        never hidden by a month filter. ADMIN and FINANCE_CHECKER.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuditPage"
        - $ref: "#/components/parameters/AuditPageSize"
        - $ref: "#/components/parameters/AuditSort"
        - $ref: "#/components/parameters/AuditOrder"
        - $ref: "#/components/parameters/AuditPeriodMonth"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditActionType"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityId"
        - $ref: "#/components/parameters/AuditActor"
      responses:
        "200":
          description: One page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /v1/audit-logs/export:
    get:
      summary: Export the filtered audit trail as CSV
      description: >
        Same filters as GET /v1/audit-logs (page/pageSize ignored), at most 10,000 rows
        (header X-Export-Truncated: true when cut). UTF-8 with BOM. The export itself is
        audited (action AUDIT_EXPORT).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuditSort"
        - $ref: "#/components/parameters/AuditOrder"
        - $ref: "#/components/parameters/AuditPeriodMonth"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditActionType"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityId"
        - $ref: "#/components/parameters/AuditActor"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /v1/adjustments:
    post:
      summary: Create a settlement adjustment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tutorUserId, periodMonth, amountSatang, reason]
              properties:
                tutorUserId:
                  type: string
                periodMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                amountSatang:
                  $ref: "#/components/schemas/SignedSatang"
                reason:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Adjustment created

  # ── Settlement runs list (owner: admin G2) ────────────────────────────
  /v1/settlements:
    get:
      summary: List settlement runs (paged)
      description: Newest period first, with per-run payout totals and status counts. ADMIN and FINANCE_CHECKER.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
        - name: status
          in: query
          required: false
          description: Run status, e.g. DRAFT, SUBMITTED, APPROVED, REJECTED.
          schema:
            type: string
            pattern: '^[A-Z_]{2,40}$'
        - name: periodMonth
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of settlement runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "403":
          $ref: "#/components/responses/AdminError"
  # ── Exceptions queue (owner: admin G3) ────────────────────────────────
  /v1/operations/exceptions:
    get:
      summary: List operational exceptions (paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOrder"
        - $ref: "#/components/parameters/ListSearch"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, UNRESOLVED, RESOLVED, VOIDED]
        - name: type
          in: query
          required: false
          description: Exception type, or ALL.
          schema:
            type: string
            maxLength: 64
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of exceptions with payment context and status/type counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
  /v1/operations/exceptions/{id}/{action}:
    post:
      summary: Resolve an exception
      description: >
        `action` is `resolve` with a typed `resolution` in the body
        (ACTIVATE_ENROLLMENT, MARK_RESOLVED, DISMISS). Legacy path actions
        (e.g. `void`, `activate-enrollment`) are mapped to a resolution.
        A note (`note` or `reason`, at least 5 characters) is required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - name: action
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z_-]{1,40}$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resolution:
                  type: string
                  maxLength: 40
                note:
                  type: string
                  maxLength: 2000
                reason:
                  type: string
                  maxLength: 2000
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Exception closed (changed=false on an idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
        "409":
          description: Exception already closed with another outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorBody"
  # ── Fraud flags (owner: admin G3) ─────────────────────────────────────
  /v1/fraud-flags:
    get:
      summary: List fraud flags (paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOrder"
        - $ref: "#/components/parameters/ListSearch"
        - name: status
          in: query
          required: false
          description: ACTIVE = OPEN/INVESTIGATING/MONITORING/FROZEN.
          schema:
            type: string
            enum: [ALL, ACTIVE, OPEN, INVESTIGATING, MONITORING, FROZEN, CLEARED]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, LOW, MEDIUM, HIGH, CRITICAL]
        - name: type
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of fraud flags with counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
  /v1/fraud-flags/{id}/action:
    post:
      summary: Act on a fraud flag
      description: Unfreezing a FROZEN flag is ADMIN only. A reason (at least 5 characters) is required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  maxLength: 40
                  description: INVESTIGATE, MONITOR, FREEZE, UNFREEZE or CLEAR (case-insensitive).
                reason:
                  type: string
                  maxLength: 2000
                note:
                  type: string
                  maxLength: 2000
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
        "403":
          $ref: "#/components/responses/AdminError"
  # ── Reconciliation actions (owner: admin G3) ──────────────────────────
  /v1/reconciliation/payments/{id}/activate:
    post:
      summary: Activate the enrollment of a successful payment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Enrollment active (changed=false when it already was)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
  /v1/reconciliation/payments/{id}/verify:
    post:
      summary: Re-check a PENDING/FAILED payment with the provider (read-only towards Omise)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Verification outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
  /v1/reconciliation/orphan-events:
    get:
      summary: Payment events not linked to any payment intent (paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOrder"
        - $ref: "#/components/parameters/ListSearch"
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, DISMISSED, ALL]
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of orphan events with link candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
  /v1/reconciliation/orphan-events/{id}/link:
    post:
      summary: Link an orphan event to the payment intent with the same charge id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentIntentId]
              properties:
                paymentIntentId:
                  type: string
                  maxLength: 64
                reason:
                  type: string
                  maxLength: 2000
                note:
                  type: string
                  maxLength: 2000
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Event linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
  /v1/reconciliation/orphan-events/{id}/dismiss:
    post:
      summary: Mark an orphan event as reviewed (audit only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Event dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
  /v1/reconciliation/active-without-payment:
    get:
      summary: ACTIVE enrollments without a successful payment (paged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOrder"
        - $ref: "#/components/parameters/ListSearch"
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 180
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of enrollments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
  # ── Users (owner: admin G4) ───────────────────────────────────────────
  /v1/users:
    get:
      summary: Admin user directory (tutors and students, paged)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - $ref: "#/components/parameters/ListPageSize"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOrder"
        - $ref: "#/components/parameters/ListSearch"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, name]
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [TUTOR, STUDENT]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, ANONYMIZED]
        - name: verification
          in: query
          required: false
          description: REVIEW = any verification field PENDING (the admin verification queue).
          schema:
            type: string
            enum: [REVIEW, UNVERIFIED, PENDING, VERIFIED, REJECTED]
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of users with role/verification counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "403":
          $ref: "#/components/responses/AdminError"
  /v1/users/{id}/payments:
    get:
      summary: Payments made/earned by a user, and a tutor's payout lines
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/ListPageSize"
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Latest payments and payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorBody"
  /v1/users/{id}/audit:
    get:
      summary: Audit events about one user (paged, ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - $ref: "#/components/parameters/ListPageSize"
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "403":
          $ref: "#/components/responses/AdminError"
  # ── Coupons (owner: admin G5) ─────────────────────────────────────────
  /v1/coupons:
    get:
      summary: List teaching-hour coupons (paged, ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
        - $ref: "#/components/parameters/ListOrder"
        - $ref: "#/components/parameters/ListSearch"
        - name: status
          in: query
          required: false
          description: Effective status (ACTIVE past its expiry counts as EXPIRED).
          schema:
            type: string
            enum: [ACTIVE, REDEEMED, VOID, EXPIRED]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, hours, expiresAt, code, redeemedAt]
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: One page of coupons with usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "403":
          $ref: "#/components/responses/AdminError"
  /v1/coupons/tutors:
    get:
      summary: Tutor picker for the coupon form (max 10, ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ListSearch"
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Matching active tutors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
  /v1/coupons/{couponId}:
    patch:
      summary: Edit note / expiry / assigned tutor of an ACTIVE coupon (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CouponId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                note:
                  type: [string, "null"]
                expiresAt:
                  type: [string, "null"]
                assignedTutorId:
                  type: [string, "null"]
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Updated coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
        "409":
          description: Coupon is not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorBody"
  /v1/coupons/{couponId}/void:
    post:
      summary: Void an unredeemed coupon (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CouponId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: [string, "null"]
                  description: Optional; when given, 5–500 characters after trimming.
      responses:
        default:
          $ref: "#/components/responses/AdminError"
        "200":
          description: Voided coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJsonObject"
        "400":
          $ref: "#/components/responses/AdminError"
        "409":
          description: Coupon not found or not ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    # ── Shared admin list params (owners: admin G2–G5) ──
    ListPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100000
    ListPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    ListLimit:
      name: limit
      in: query
      required: false
      description: Legacy alias of pageSize.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    ListOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
    ListSearch:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    CouponId:
      name: couponId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    # ── Audit trail query params (owner: admin G1) ──
    AuditPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    AuditPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AuditSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [createdAt]
    AuditOrder:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AuditPeriodMonth:
      name: periodMonth
      in: query
      required: false
      description: Bangkok calendar month of the event time (created_at), YYYY-MM.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    AuditFrom:
      name: from
      in: query
      required: false
      description: First Bangkok calendar day (inclusive), YYYY-MM-DD.
      schema:
        type: string
        format: date
    AuditTo:
      name: to
      in: query
      required: false
      description: Last Bangkok calendar day (inclusive), YYYY-MM-DD.
      schema:
        type: string
        format: date
    AuditActionType:
      name: actionType
      in: query
      required: false
      description: One action or a comma-separated list, e.g. APPROVE,APPROVE_SETTLEMENT.
      schema:
        type: string
        pattern: '^[A-Z0-9_]{1,64}(,[A-Z0-9_]{1,64}){0,29}$'
    AuditEntityType:
      name: entityType
      in: query
      required: false
      description: e.g. SettlementRun, Adjustment, User, FraudFlag, Exception, Coupon.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_]{1,64}$'
    AuditEntityId:
      name: entityId
      in: query
      required: false
      description: Exact id of the affected record (e.g. a user id for that user's history).
      schema:
        type: string
        maxLength: 128
    AuditActor:
      name: actor
      in: query
      required: false
      description: Actor user id (uuid), SYSTEM, or text matched against the actor's email / display name.
      schema:
        type: string
        maxLength: 120
  schemas:
    ReasonBody:
      type: object
      additionalProperties: false
      description: Admin note for the audit trail (`reason`, or legacy `note`).
      properties:
        reason:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000
    AdminJsonObject:
      type: object
      description: Admin endpoint JSON body (shape documented in the controller; not pinned here).
      additionalProperties: true
    AdminErrorBody:
      type: object
      description: Admin endpoint error (requestId is optional on some legacy controllers).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    AuditLogEntry:
      type: object
      required: [auditId, actionType, actorUserId, displayName, entityType, targetId, createdAt]
      properties:
        auditId:
          type: string
        actionType:
          type: string
        actorUserId:
          type: string
        displayName:
          type: string
        actorEmail:
          type: [string, "null"]
        actorRole:
          type: [string, "null"]
        entityType:
          type: string
        targetId:
          type: string
        periodMonth:
          type: string
        previousStatus:
          type: string
        newStatus:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata: {}
    AuditLogPage:
      type: object
      required: [logs, pagination]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        pagination:
          type: object
          required: [total, page, pageSize, totalPages]
          properties:
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            pageSize:
              type: integer
              minimum: 1
            totalPages:
              type: integer
              minimum: 1
    PositiveSatang:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Positive integer amount in Satang within JavaScript's safe integer range.
    SignedSatang:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
      not:
        const: 0
      description: Non-zero integer amount in Satang within JavaScript's safe integer range.
    SettlementPreview:
      type: object
      additionalProperties: false
      required:
        [snapshotId, periodMonth, totalPayoutSatang, totalNetPayoutSatang, payoutLineCount, status]
      properties:
        snapshotId:
          type: string
        periodMonth:
          type: string
        totalPayoutSatang:
          $ref: "#/components/schemas/NonNegativeSatang"
        totalNetPayoutSatang:
          $ref: "#/components/schemas/NonNegativeSatang"
        payoutLineCount:
          type: integer
          minimum: 0
        status:
          type: string
    NonNegativeSatang:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
  responses:
    AdminError:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminErrorBody"
    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
